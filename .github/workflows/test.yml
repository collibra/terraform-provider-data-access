# Terraform Provider testing workflow.
name: Collibra Data Access Terraform Provider - Acceptance tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on:
      - runs-on
      - runner=sm
      - env=production-eu
      - tag=terraform-provider-data-access
      - tag=job-${{ github.job }}-${{ github.run_id }}
    timeout-minutes: 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup private repo access
        run: |
          git config --global url.https://${GH_ACCESS_TOKEN}@github.com/.insteadOf https://github.com/
        env:
          GH_ACCESS_TOKEN: ${{ secrets.COLLIBRA_GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
          check-latest: true
          cache: true

      - name: Mod Tidy
        run: go mod tidy

      - name: Build
        run: go build -v .

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9  # v8
        with:
          version: v2.12.2

      - name: FOSSA Scan
        uses: fossas/fossa-action@ff70fe9fe17cbd2040648f1c45e8ec4e4884dcf3  # v1
        with:
          api-key: ${{ secrets.FOSSA_PUBLIC_API_KEY }}

  generate:
    runs-on:
      - runs-on
      - runner=sm
      - env=production-eu
      - tag=terraform-provider-data-access
      - tag=job-${{ github.job }}-${{ github.run_id }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup private repo access
        run: |
          git config --global url.https://${GH_ACCESS_TOKEN}@github.com/.insteadOf https://github.com/
        env:
          GH_ACCESS_TOKEN: ${{ secrets.COLLIBRA_GITHUB_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: "go.sum"
          check-latest: true
          cache: true

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Mod Tidy
        run: go mod tidy

      - name: Generate
        run: go generate ./...

      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs:
      - build
      - generate
    uses: ./.github/workflows/acceptance-tests.yml
    secrets: inherit

  # SonarQube needs the acceptance-test coverage report, so it must run after the test job.
  sonarqube:
    name: SonarQube Scan
    needs:
      - test
    runs-on:
      - runs-on
      - runner=sm
      - env=production-eu
      - tag=terraform-provider-data-access
      - tag=job-${{ github.job }}-${{ github.run_id }}
    timeout-minutes: 5
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: acceptance-test-coverage

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703  # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_PUBLIC_API_KEY }}
          SONAR_HOST_URL: https://sonarqube.collibra.dev
        with:
          args: >
            -Dsonar.pullrequest.github.repository=collibra/terraform-provider-data-access

  # Single required status check for branch protection. SonarQube is informational only,
  # so it is deliberately left out of `needs` and does not gate this job.
  validation_end:
    name: Validation
    if: always()
    needs:
      - build
      - generate
      - test
    runs-on:
      - runs-on
      - runner=sm
      - env=production-eu
      - tag=terraform-provider-data-access
      - tag=job-${{ github.job }}-${{ github.run_id }}
    steps:
      - name: Check required jobs
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."